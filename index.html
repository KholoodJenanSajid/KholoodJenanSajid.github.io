<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Kholood — Portfolio</title>
  <meta name="description" content="Kholood Jenan Sajid — engineer building end-to-end systems." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Preload character frames for zero-lag initial render -->
  <link rel="preload" as="image" href="public/frames/center.webp" />
  <link rel="preload" as="image" href="public/frames/frame_00.webp" />
  <link rel="preload" as="image" href="public/frames/frame_16.webp" />
  <link rel="preload" as="image" href="public/frames/frame_32.webp" />
  <link rel="preload" as="image" href="public/frames/frame_48.webp" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Full-viewport canvas: the character lives here, driven by cursor angle -->
  <canvas id="hero-canvas" aria-hidden="true"></canvas>

  <!-- Bottom scrim: darkens the lower portion so hero copy stays legible over
       the character's dress. Only visible on tablet/mobile via media queries. -->
  <div class="scrim" aria-hidden="true"></div>

  <!-- Floating frosted-glass nav pill -->
  <nav class="pill-nav" aria-label="Primary">
    <a href="#work">WORK</a>
    <a href="#about">ABOUT</a>
    <a href="#contact">CONTACT</a>
  </nav>

  <!-- Hero copy: bottom-left -->
  <section class="hero-copy">
    <span class="greeting">Hi, I&rsquo;m</span>
    <h1 class="name">Kholood</h1>
    <p class="bio">
      Full-stack engineer with a data-engineering heart. I ship end-to-end
      systems &mdash; pipelines, backends, and interfaces that don&rsquo;t lie
      about the data.
    </p>
    <div class="ctas">
      <a href="#resume" class="btn btn-solid" data-magnetic>
        <span>Resume</span>
        <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="M13 6l6 6-6 6" />
        </svg>
      </a>
      <a href="#contact" class="btn btn-ghost" data-magnetic>Let&rsquo;s Talk</a>
    </div>
  </section>

  <!-- Custom magnetic cursor: dot + trailing ring -->
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <!-- Loader shroud (fades out once frames are decoded) -->
  <div id="loader" aria-hidden="true"></div>

  <script src="hero.js" defer></script>
</body>
</html>
